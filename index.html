<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Common Free Time</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="panel hero">
      <h1>Common Free Time</h1>
      <p>Compare timetables and find the slots where everyone is free.</p>
    </header>

    <p id="error" class="error"></p>

    <section class="panel controls">
      <span class="label">Who's in?</span>
      <div id="people" class="people"></div>
    </section>

    <nav class="panel weeknav">
      <button id="prev" class="gel" aria-label="Previous week">&larr;</button>
      <strong id="week-label"></strong>
      <button id="next" class="gel" aria-label="Next week">&rarr;</button>
      <button id="today" class="gel">Today</button>
      <span class="legend"><i class="swatch"></i> everyone free</span>
    </nav>

    <div class="panel scroll"><div id="grid" class="grid"></div></div>

    <section class="panel">
      <h2>Common free slots this week</h2>
      <ul id="free-list" class="free-list"></ul>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
