<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#35a7f0">
  <title>Common Free Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Real 3D background (WebGL, js/scene3d.js). Hidden until it starts; the CSS scene below is the fallback. -->
  <canvas id="bg3d" aria-hidden="true"></canvas>

  <!-- shared water gradients, used by the wave paths below -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="water-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4efff" stop-opacity=".6"/><stop offset="1" stop-color="#3fb0ee" stop-opacity=".6"/></linearGradient>
      <linearGradient id="water-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd8ff" stop-opacity=".7"/><stop offset="1" stop-color="#0f86d8" stop-opacity=".75"/></linearGradient>
      <linearGradient id="water-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3cc0f5" stop-opacity=".85"/><stop offset="1" stop-color="#0360b8" stop-opacity=".95"/></linearGradient>
    </defs>
  </svg>

  <!-- 3D background: three depth layers (far -> near), each following the mouse a bit more.
       Bubbles rise from behind the waves; chrome spheres bob on the water. -->
  <div class="scene" aria-hidden="true">
    <div class="layer far">
      <span class="bubble" style="--s:40px;  --x:12%; --d:22s; --delay:-4s;  --dx:-20px"></span>
      <span class="bubble" style="--s:55px;  --x:58%; --d:25s; --delay:-15s; --dx:25px"></span>
      <span class="bubble" style="--s:35px;  --x:90%; --d:20s; --delay:-8s;  --dx:-15px"></span>
      <div class="cube-wrap" style="--s:50px; --x:30%; --y:55%; --d:11s; --spin:26s; --dx:30px"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <span class="drop" style="--s:14px; --x:20%; --d:9s;  --delay:-2s; --dx:10px"></span>
      <span class="drop" style="--s:10px; --x:74%; --d:11s; --delay:-7s; --dx:-8px"></span>
      <span class="chrome" style="--s:64px; --x:50%; --y:76%; --d:5s; --dx:8px"></span>
      <div class="wave" style="--h:20vh; --d:70s; --dir:normal"><svg viewBox="0 0 2160 120" preserveAspectRatio="none"><path fill="url(#water-far)" d="M0 50 C90 15 270 15 360 50 C450 85 630 85 720 50 C810 15 990 15 1080 50 C1170 85 1350 85 1440 50 C1530 15 1710 15 1800 50 C1890 85 2070 85 2160 50 L2160 120 L0 120 Z"/><path class="crest" d="M0 50 C90 15 270 15 360 50 C450 85 630 85 720 50 C810 15 990 15 1080 50 C1170 85 1350 85 1440 50 C1530 15 1710 15 1800 50 C1890 85 2070 85 2160 50"/></svg></div>
    </div>
    <div class="layer mid">
      <span class="bubble" style="--s:90px;  --x:6%;  --d:19s; --delay:-3s;  --dx:40px"></span>
      <span class="bubble" style="--s:70px;  --x:44%; --d:16s; --delay:-9s;  --dx:-30px"></span>
      <span class="bubble" style="--s:100px; --x:72%; --d:21s; --delay:-12s; --dx:35px"></span>
      <div class="cube-wrap" style="--s:90px; --x:78%; --y:22%; --d:13s; --spin:32s; --dx:-40px"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <!-- gyroscope: three metal rings spinning on different axes -->
      <div class="gyro-wrap" style="--s:150px; --x:62%; --y:46%; --d:14s; --dx:-30px"><div class="gyro"><i></i><i></i><i></i></div></div>
      <span class="drop" style="--s:18px; --x:36%; --d:8s;  --delay:-5s; --dx:-12px"></span>
      <span class="chrome" style="--s:100px; --x:12%; --y:70%; --d:6s; --dx:-10px"></span>
      <div class="wave" style="--h:15vh; --d:48s; --dir:reverse"><svg viewBox="0 0 2160 120" preserveAspectRatio="none"><path fill="url(#water-mid)" d="M0 50 C90 15 270 15 360 50 C450 85 630 85 720 50 C810 15 990 15 1080 50 C1170 85 1350 85 1440 50 C1530 15 1710 15 1800 50 C1890 85 2070 85 2160 50 L2160 120 L0 120 Z"/><path class="crest" d="M0 50 C90 15 270 15 360 50 C450 85 630 85 720 50 C810 15 990 15 1080 50 C1170 85 1350 85 1440 50 C1530 15 1710 15 1800 50 C1890 85 2070 85 2160 50"/></svg></div>
    </div>
    <div class="layer near">
      <span class="bubble" style="--s:190px; --x:34%; --d:28s; --delay:-14s; --dx:50px"></span>
      <span class="bubble" style="--s:150px; --x:86%; --d:24s; --delay:-6s;  --dx:-45px"></span>
      <div class="cube-wrap" style="--s:140px; --x:4%; --y:40%; --d:15s; --spin:40s; --dx:50px"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <span class="drop" style="--s:24px; --x:90%; --d:7s;  --delay:-1s; --dx:-14px"></span>
      <span class="drop" style="--s:20px; --x:52%; --d:9s;  --delay:-6s; --dx:12px"></span>
      <span class="chrome" style="--s:170px; --x:76%; --y:74%; --d:7s; --dx:-14px"></span>
      <div class="wave" style="--h:10vh; --d:30s; --dir:normal"><svg viewBox="0 0 2160 120" preserveAspectRatio="none"><path fill="url(#water-near)" d="M0 50 C90 15 270 15 360 50 C450 85 630 85 720 50 C810 15 990 15 1080 50 C1170 85 1350 85 1440 50 C1530 15 1710 15 1800 50 C1890 85 2070 85 2160 50 L2160 120 L0 120 Z"/><path class="crest" d="M0 50 C90 15 270 15 360 50 C450 85 630 85 720 50 C810 15 990 15 1080 50 C1170 85 1350 85 1440 50 C1530 15 1710 15 1800 50 C1890 85 2070 85 2160 50"/></svg></div>
    </div>
  </div>

  <div class="page">
    <header class="panel hero">
      <h1>Common Free Time</h1>
      <p>Compare timetables and find the slots where everyone is free.</p>
    </header>

    <p id="error" class="error"></p>

    <section class="panel controls">
      <span class="label">Who's in?</span>
      <div id="people" class="people"></div>
      <div class="view">
        <span class="label">View</span>
        <div class="seg">
          <button class="gel" data-mode="stacked" aria-pressed="true">Stacked</button>
          <button class="gel off" data-mode="side" aria-pressed="false">Side by side</button>
        </div>
      </div>
    </section>

    <nav class="panel weeknav">
      <button id="prev" class="gel" aria-label="Previous week">&larr;</button>
      <strong id="week-label"></strong>
      <button id="next" class="gel" aria-label="Next week">&rarr;</button>
      <button id="today" class="gel">Today</button>
    </nav>

    <div class="panel scroll"><div id="grid" class="grid"></div></div>

    <section class="panel">
      <h2>Common free slots this week</h2>
      <ul id="free-list" class="free-list"></ul>
    </section>

    <!-- Last screen: empty on purpose, so the background can be seen on its own. -->
    <div class="vista">
      <div class="vista-bar">
        <div class="panel tod">
          <span class="label">Time of day</span>
          <input id="tod-range" type="range" min="0" max="24" step="0.05" value="10" aria-label="Time of day">
          <strong id="tod-clock">10:00</strong>
          <div class="seg">
            <button id="tod-live" class="gel" aria-pressed="true" title="Follow the clock of this device">Live</button>
            <button id="tod-lapse" class="gel off" aria-pressed="false" title="Watch a whole day pass in 6 minutes">Time-lapse</button>
          </div>
        </div>
        <button id="to-top" class="gel">&uarr; Back to timetable</button>
      </div>
    </div>
  </div>

  <div id="tip" class="tip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
